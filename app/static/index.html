<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pdfTool</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#014d54">
<style>
  :root {
    color-scheme: light dark;
    --bg: #eaf3f3; --panel: #fff; --ink: #10242b; --muted: #587078; --line: #d5e3e4;
    --accent: #026a72; --accent-ink: #fff; --soft: #e3f2f2; --danger: #b3361b;
    --shadow: 0 6px 20px rgba(2, 60, 66, .10); --r: 18px;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0c1a1d; --panel: #13262a; --ink: #e6f1f2; --muted: #8fa9ae; --line: #23393e; --accent: #11a0aa; --soft: #17343a; --danger: #ff8a70; --shadow: 0 6px 20px rgba(0, 0, 0, .35); }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; padding-bottom: 130px; }
  header { background: linear-gradient(135deg, #014d54, #0b8f98); color: #fff; padding: 22px 0 46px; border-radius: 0 0 28px 28px; }
  .wrap { max-width: 1200px; margin: 0 auto; padding: 0 24px; }
  header .wrap { display: flex; align-items: center; gap: 16px; }
  header img { width: 60px; height: 60px; border-radius: 16px; flex: none; box-shadow: 0 4px 14px rgba(0, 0, 0, .25); }
  h1 { margin: 0; font-size: 1.7rem; font-weight: 700; letter-spacing: -.02em; }
  header p { margin: 2px 0 0; opacity: .85; }
  main { display: grid; grid-template-columns: minmax(0, 1fr) 310px; gap: 22px; margin-top: -28px; align-items: start; }
  @media (max-width: 860px) { main { grid-template-columns: 1fr; } .wrap { padding: 0 16px; } header p { font-size: .92rem; } }

  .card { background: var(--panel); border-radius: var(--r); box-shadow: var(--shadow); }
  .drop { border: 2px dashed var(--line); background: var(--panel); border-radius: var(--r); box-shadow: var(--shadow); padding: 30px 16px; text-align: center; transition: border-color .15s, background .15s, transform .15s; }
  .drop.over { border-color: var(--accent); background: var(--soft); transform: scale(1.01); }
  .drop .ico { width: 56px; height: 56px; margin: 0 auto 8px; display: grid; place-items: center; border-radius: 50%; background: var(--soft); color: var(--accent); }
  .drop strong { display: block; font-size: 1.1rem; }
  .drop span { color: var(--muted); }
  .row { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; margin-top: 16px; }
  .row button { min-width: 150px; }

  button, .btn { font: inherit; border: 1px solid var(--line); background: var(--panel); color: var(--ink); padding: 9px 16px; border-radius: 999px; cursor: pointer; text-decoration: none; display: inline-block; transition: border-color .15s, background .15s; }
  button:hover:not(:disabled), .btn:hover { border-color: var(--accent); }
  button:focus-visible, input:focus-visible, select:focus-visible, a:focus-visible { outline: 3px solid #7cc9c4; outline-offset: 2px; }
  button:disabled { opacity: .5; cursor: not-allowed; }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 650; padding: 12px 28px; box-shadow: 0 4px 14px rgba(2, 106, 114, .35); }

  .toolbar { display: flex; justify-content: space-between; align-items: center; margin: 20px 0 12px; gap: 8px; flex-wrap: wrap; }
  .toolbar .count { font-weight: 650; }
  .toolbar .actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .toolbar button { padding: 5px 12px; font-size: .9rem; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 14px; }
  .page { background: var(--panel); border-radius: 14px; padding: 8px; box-shadow: var(--shadow); border: 2px solid transparent; transition: transform .15s; }
  .page:hover { transform: translateY(-2px); }
  .page.dragging { opacity: .35; }
  .page.target { border-color: var(--accent); }
  .thumb { position: relative; height: 160px; display: grid; place-items: center; background: var(--soft); border-radius: 10px; overflow: hidden; cursor: grab; padding: 10px; }
  .thumb img { max-width: 100%; max-height: 100%; background: #fff; border-radius: 3px; box-shadow: 0 3px 10px rgba(0, 0, 0, .22); transition: transform .2s; }
  .num { position: absolute; z-index: 2; top: 6px; left: 6px; min-width: 26px; height: 26px; padding: 0 7px; display: grid; place-items: center; border-radius: 13px; background: var(--accent); color: #fff; font-size: .8rem; font-weight: 700; }
  .tag { position: absolute; z-index: 2; border: 1px solid var(--line); top: 6px; right: 6px; padding: 1px 8px; border-radius: 10px; background: #fff; color: var(--accent); font-size: .7rem; font-weight: 700; box-shadow: 0 1px 4px rgba(0, 0, 0, .2); }
  .meta { margin-top: 6px; font-size: .8rem; color: var(--muted); text-align: center; }
  .tools { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; margin-top: 6px; }
  .tools button { padding: 5px 0; border-radius: 10px; display: grid; place-items: center; }
  .tools .del:hover:not(:disabled) { border-color: var(--danger); color: var(--danger); }
  @media (hover: hover) { .tools { opacity: 0; transition: opacity .15s; } .page:hover .tools, .page:focus-within .tools { opacity: 1; } }

  aside { padding: 20px; position: sticky; top: 16px; }
  @media (max-width: 860px) { aside { position: static; } }
  aside h2 { margin: 0 0 14px; font-size: 1.05rem; }
  .field { margin-bottom: 16px; }
  .field label.t { display: block; font-weight: 600; margin-bottom: 4px; }
  .field small { display: block; color: var(--muted); line-height: 1.35; }
  select, input[type=text] { width: 100%; font: inherit; padding: 9px 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--panel); color: var(--ink); }
  .check { display: flex; gap: 12px; align-items: flex-start; cursor: pointer; }
  .check input { appearance: none; flex: none; width: 42px; height: 24px; margin: 2px 0 0; border-radius: 12px; background: var(--line); position: relative; cursor: pointer; transition: background .2s; }
  .check input::after { content: ""; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0, 0, 0, .3); transition: transform .2s; }
  .check input:checked { background: var(--accent); }
  .check input:checked::after { transform: translateX(18px); }

  .bar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; background: color-mix(in srgb, var(--panel) 92%, transparent); backdrop-filter: blur(10px); border-top: 1px solid var(--line); padding: 10px 0 calc(10px + env(safe-area-inset-bottom, 0px)); }
  .bar .wrap { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  #status { color: var(--muted); font-size: .95rem; flex: 1 1 100%; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  #status:empty { display: none; }
  #status.err { color: var(--danger); }
  #status .btn, #status button { padding: 4px 12px; font-size: .9rem; }
  .prog { display: inline-block; width: 120px; height: 6px; border-radius: 3px; background: var(--line); position: relative; overflow: hidden; }
  .prog::after { content: ""; position: absolute; inset: 0 auto 0 0; width: 40%; background: var(--accent); border-radius: 3px; animation: p 1.1s ease-in-out infinite; }
  .barinfo { color: var(--muted); }
  dialog { border: 0; border-radius: var(--r); padding: 22px; width: min(420px, 92vw); background: var(--panel); color: var(--ink); box-shadow: 0 20px 60px rgba(0, 0, 0, .35); }
  dialog::backdrop { background: rgba(6, 24, 28, .55); }
  dialog label { display: block; margin-bottom: 10px; }
  .dlg-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 18px; }
  .dlg-actions .ok { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 650; }
  dialog.prev { padding: 0; width: fit-content; min-width: min(340px, 96vw); max-width: 96vw; overflow: hidden; }
  .prev .head { display: flex; align-items: center; gap: 8px; padding: 10px 14px; border-bottom: 1px solid var(--line); }
  .prev .head b { flex: 1; }
  .prev .head button { padding: 6px 12px; display: grid; place-items: center; }
  .prevbox { position: relative; margin: 0 auto; overflow: hidden; background: var(--soft); } /* larghezza e altezza le imposta fitPreview() */
  .prevbox img { position: absolute; left: 50%; top: 50%; background: #fff; box-shadow: 0 4px 20px rgba(0, 0, 0, .25); }
  #prevMsg { position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%); padding: 3px 12px; border-radius: 12px; background: var(--panel); color: var(--muted); font-size: .85rem; }
  #prevMsg:empty { display: none; }
  [hidden] { display: none !important; }
  .grid { user-select: none; }
  .page { cursor: pointer; }
  .page.sel { border-color: var(--accent); background: var(--soft); }
  .page.sel .thumb::after { content: "✓"; position: absolute; z-index: 2; right: 6px; bottom: 6px; width: 26px; height: 26px; display: grid; place-items: center; border-radius: 50%; background: var(--accent); color: #fff; font-weight: 700; }
  .selbar { position: sticky; top: 8px; z-index: 4; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin: 0 0 12px; padding: 8px 12px; border-radius: 14px; background: var(--accent); color: #fff; box-shadow: var(--shadow); }
  .selbar b { margin-right: auto; }
  .selbar button { padding: 5px 12px; font-size: .9rem; background: rgba(255, 255, 255, .14); border-color: rgba(255, 255, 255, .35); color: #fff; }
  .selbar button:hover:not(:disabled) { background: rgba(255, 255, 255, .28); border-color: #fff; }
  .count small { font-weight: 400; color: var(--muted); }
  @media (max-width: 600px) { .count small { display: none; } }
  @keyframes p { 0% { transform: translateX(-100%); } 100% { transform: translateX(260%); } }
  @media (prefers-reduced-motion: reduce) { .prog::after { animation: none; width: 100%; } .thumb img, .page, .drop { transition: none; } }
</style>
</head>
<body>
<header>
  <div class="wrap">
    <img src="/icon-192.png" alt="" width="60" height="60">
    <div>
      <h1>pdfTool</h1>
      <p>Foto, screenshot e PDF: riordina, ruota, elimina pagine e uniscile in un unico PDF.</p>
    </div>
  </div>
</header>

<div class="wrap">
<main>
  <section>
    <div class="drop" id="drop">
      <div class="ico"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4M7 9l5-5 5 5M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3"/></svg></div>
      <strong>Trascina qui immagini o PDF</strong>
      <span>JPEG, PNG, WebP, PDF. Anche più file insieme, anche mischiati.</span>
      <div class="row">
        <button type="button" id="pick">Scegli file</button>
        <button type="button" id="shoot">Scatta una foto</button>
      </div>
      <input type="file" id="file" accept="image/*,application/pdf" multiple hidden>
      <input type="file" id="cam" accept="image/*" capture="environment" hidden>
    </div>

    <div class="toolbar" id="toolbar" hidden>
      <span class="count" id="count"></span>
      <div class="actions">
        <button type="button" id="selAll" title="Clic su una pagina per selezionarla, Maiusc+clic per un intervallo">Seleziona tutte</button>
        <button type="button" id="sortName">Ordina per nome</button>
        <button type="button" id="sortDate">Ordina per data</button>
        <button type="button" id="clear">Elimina tutte</button>
      </div>
    </div>
    <div class="selbar" id="selbar" hidden>
      <b id="selCount"></b>
      <button type="button" id="selRot">Ruota</button>
      <button type="button" id="selTop">All'inizio</button>
      <button type="button" id="selEnd">Alla fine</button>
      <button type="button" id="selInv">Inverti</button>
      <button type="button" id="selDel">Elimina</button>
      <button type="button" id="selNone">Annulla</button>
    </div>
    <div class="grid" id="grid"></div>
  </section>

  <aside class="card">
    <h2>Opzioni del PDF</h2>
    <div class="field">
      <label class="check"><input type="checkbox" id="ocr" checked>
        <span><b>Riconosci il testo (OCR)</b><small>Il PDF diventa ricercabile e gli agenti AI lo leggono meglio. Richiede più tempo.</small></span>
      </label>
    </div>
    <div class="field">
      <label class="t" for="lang">Lingua del testo</label>
      <select id="lang">
        <option value="ita" selected>Italiano</option>
        <option value="eng">Inglese</option>
        <option value="ita+eng">Italiano + inglese</option>
      </select>
    </div>
    <div class="field">
      <label class="check"><input type="checkbox" id="enhance">
        <span><b>Migliora le foto di pagine</b><small>Scala di grigi, più contrasto e raddrizzamento. Solo per le immagini, utile per foto e non per screenshot.</small></span>
      </label>
    </div>
    <div class="field">
      <label class="t" for="max">Peso massimo</label>
      <select id="max">
        <option value="0" selected>Nessun limite</option>
        <option value="10">10 MB</option>
        <option value="20">20 MB</option>
        <option value="30">30 MB</option>
        <option value="50">50 MB</option>
      </select>
      <small>Se serve, le immagini vengono ridotte finché il file rientra.</small>
    </div>
  </aside>
</main>
</div>

<div class="bar">
  <div class="wrap">
    <div id="status" role="status" aria-live="polite"></div>
    <span class="barinfo" id="barinfo"></span>
    <button class="primary" id="go" disabled>Crea PDF</button>
  </div>
</div>

<dialog id="prevDlg" class="prev">
  <div class="head">
    <b id="prevTitle"></b>
    <button type="button" id="prevPrev" aria-label="Pagina precedente"></button>
    <button type="button" id="prevNext" aria-label="Pagina successiva"></button>
    <button type="button" id="prevClose" aria-label="Chiudi"></button>
  </div>
  <div class="prevbox"><img id="prevImg" alt="Anteprima della pagina"><span id="prevMsg" role="status"></span></div>
</dialog>

<dialog id="nameDlg">
  <form method="dialog" id="nameForm">
    <label for="name"><b>Con che nome salvo il PDF?</b></label>
    <input type="text" id="name" autocomplete="off" placeholder="es. Storia capitolo 3" required>
    <div class="dlg-actions">
      <button type="button" id="nameCancel">Annulla</button>
      <button type="submit" class="ok">Crea PDF</button>
    </div>
  </form>
</dialog>

<script>
const $ = (id) => document.getElementById(id);
let pages = []; // { id, file, url, rot, page }  (page = null per le immagini, indice per i PDF)
let nextId = 1;
let dragFrom = null;

const svg = (d) => `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${d}</svg>`;
const ICON = {
  left: svg('<path d="M15 18l-6-6 6-6"/>'),
  right: svg('<path d="M9 18l6-6-6-6"/>'),
  rot: svg('<path d="M21 12a9 9 0 1 1-3-6.7M21 4v5h-5"/>'),
  zoom: svg('<circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4M11 8v6M8 11h6"/>'),
  close: svg('<path d="M6 6l12 12M18 6L6 18"/>'),
  del: svg('<path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1l1-12M9 7V4h6v3"/>'),
};

function esc(s) { return s.replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }

async function addPdf(f) {
  setStatus('<span class="prog"></span>Leggo ' + esc(f.name) + "…");
  try {
    const fd = new FormData();
    fd.append("file", f, f.name);
    const res = await fetch("/api/thumbs", { method: "POST", body: fd });
    if (!res.ok) {
      let msg = "Impossibile leggere il PDF.";
      try { msg = (await res.json()).detail || msg; } catch (_) {}
      throw new Error(msg);
    }
    const { thumbs } = await res.json();
    thumbs.forEach((url, i) => pages.push({ id: nextId++, file: f, url, rot: 0, page: i }));
    setStatus("");
  } catch (e) {
    setStatus(esc(f.name) + ": " + esc(e.message), true);
  }
}

async function addFiles(list) {
  for (const f of Array.from(list)) {
    if (f.type === "application/pdf" || /\.pdf$/i.test(f.name)) {
      await addPdf(f);
    } else if (f.type.startsWith("image/")) {
      pages.push({ id: nextId++, file: f, url: URL.createObjectURL(f), rot: 0, page: null });
    }
  }
  render();
}

function move(i, j) {
  if (j < 0 || j >= pages.length || i === j) return;
  const [p] = pages.splice(i, 1);
  pages.splice(j, 0, p);
  render();
}

function render() {
  const grid = $("grid");
  grid.innerHTML = "";
  pages.forEach((p, i) => {
    const el = document.createElement("div");
    el.className = "page" + (selected.has(p.id) ? " sel" : "");
    el.draggable = true;
    const isPdf = p.page !== null;
    el.innerHTML = `
      <div class="thumb"><span class="num">${i + 1}</span>${isPdf ? '<span class="tag">PDF</span>' : ""}<img alt="Pagina ${i + 1}" src="${p.url}" style="transform: rotate(${p.rot}deg)"></div>
      <div class="meta">${isPdf ? "Pagina " + (p.page + 1) + " del PDF" : (p.file.size / 1024 / 1024).toFixed(1) + " MB"}</div>
      <div class="tools">
        <button type="button" data-a="left" aria-label="Sposta prima" ${i === 0 ? "disabled" : ""}>${ICON.left}</button>
        <button type="button" data-a="right" aria-label="Sposta dopo" ${i === pages.length - 1 ? "disabled" : ""}>${ICON.right}</button>
        <button type="button" data-a="rot" aria-label="Ruota di 90 gradi">${ICON.rot}</button>
        <button type="button" data-a="zoom" aria-label="Anteprima grande">${ICON.zoom}</button>
        <button type="button" class="del" data-a="del" aria-label="Elimina pagina">${ICON.del}</button>
      </div>`;
    el.addEventListener("click", (e) => {
      const a = e.target.closest("button")?.dataset.a;
      if (!a) { toggleSel(i, e.shiftKey); return; }
      if (a === "left") move(i, i - 1);
      if (a === "right") move(i, i + 1);
      if (a === "rot") { p.rot = (p.rot + 90) % 360; render(); }
      if (a === "zoom") openPreview(i);
      if (a === "del") { URL.revokeObjectURL(p.url); dropPreview(p.id); selected.delete(p.id); pages.splice(i, 1); render(); }
    });
    el.addEventListener("dblclick", (e) => { if (!e.target.closest("button")) openPreview(i); });
    el.addEventListener("dragstart", () => { dragFrom = i; el.classList.add("dragging"); });
    el.addEventListener("dragend", () => { dragFrom = null; el.classList.remove("dragging"); });
    el.addEventListener("dragover", (e) => { if (dragFrom !== null) { e.preventDefault(); el.classList.add("target"); } });
    el.addEventListener("dragleave", () => el.classList.remove("target"));
    el.addEventListener("drop", (e) => {
      if (dragFrom === null) return;
      e.preventDefault(); e.stopPropagation();
      dropSelected(dragFrom, i);
    });
    grid.appendChild(el);
  });
  const n = pages.length;
  $("toolbar").hidden = n === 0;
  $("count").innerHTML = (n === 1 ? "1 pagina" : `${n} pagine`) + " <small>· clic per selezionare, Maiusc+clic per un intervallo</small>";
  lastSel = -1;
  $("barinfo").textContent = n ? (n === 1 ? "1 pagina pronta" : `${n} pagine pronte`) : "Aggiungi file per iniziare";
  $("go").disabled = n === 0;
  updateSel();
}

// ---- selezione multipla ----
const selected = new Set(); // id delle pagine selezionate
let lastSel = -1;
function updateSel() {
  const kids = $("grid").children;
  pages.forEach((p, k) => kids[k]?.classList.toggle("sel", selected.has(p.id)));
  const n = selected.size;
  $("selbar").hidden = n === 0;
  $("selCount").textContent = n === 1 ? "1 selezionata" : `${n} selezionate`;
}
// si aggiornano solo le classi, senza ridisegnare la griglia: così il doppio clic per l'anteprima funziona
function toggleSel(i, range) {
  if (range && lastSel >= 0) {
    for (let k = Math.min(lastSel, i); k <= Math.max(lastSel, i); k++) selected.add(pages[k].id);
  } else {
    const id = pages[i].id;
    selected.has(id) ? selected.delete(id) : selected.add(id);
  }
  lastSel = i;
  updateSel();
}
function moveSelected(toTop) {
  const sel = pages.filter((p) => selected.has(p.id)), rest = pages.filter((p) => !selected.has(p.id));
  pages = toTop ? [...sel, ...rest] : [...rest, ...sel];
  render();
}
// trascinando una pagina selezionata si sposta tutto il gruppo
function dropSelected(from, to) {
  if (!selected.has(pages[from].id) || selected.size < 2) return move(from, to);
  const t = pages[to];
  if (selected.has(t.id)) return;
  const block = pages.filter((p) => selected.has(p.id)), rest = pages.filter((p) => !selected.has(p.id));
  rest.splice(rest.indexOf(t) + (from < to ? 1 : 0), 0, ...block);
  pages = rest;
  render();
}
$("selAll").onclick = () => { pages.forEach((p) => selected.add(p.id)); updateSel(); };
$("selInv").onclick = () => { pages.forEach((p) => (selected.has(p.id) ? selected.delete(p.id) : selected.add(p.id))); updateSel(); };
$("selNone").onclick = () => { selected.clear(); updateSel(); };
$("selRot").onclick = () => { pages.forEach((p) => { if (selected.has(p.id)) p.rot = (p.rot + 90) % 360; }); render(); };
$("selTop").onclick = () => moveSelected(true);
$("selEnd").onclick = () => moveSelected(false);
$("selDel").onclick = () => {
  const n = selected.size;
  if (n >= 5 && !confirm(`Eliminare ${n} pagine?`)) return;
  pages = pages.filter((p) => {
    if (!selected.has(p.id)) return true;
    URL.revokeObjectURL(p.url); dropPreview(p.id);
    return false;
  });
  selected.clear();
  render();
};
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && selected.size && !document.querySelector("dialog[open]")) { selected.clear(); updateSel(); }
});

// ---- anteprima ingrandita (doppio clic o pulsante lente) ----
const prevCache = new Map(); // id pagina -> URL dell'immagine ad alta risoluzione
let prevIdx = -1;
function dropPreview(id) { const u = prevCache.get(id); if (u) { URL.revokeObjectURL(u); prevCache.delete(id); } }
$("prevPrev").innerHTML = ICON.left; $("prevNext").innerHTML = ICON.right; $("prevClose").innerHTML = ICON.close;
$("prevClose").onclick = () => $("prevDlg").close();
$("prevPrev").onclick = () => openPreview(prevIdx - 1);
$("prevNext").onclick = () => openPreview(prevIdx + 1);
$("prevDlg").addEventListener("click", (e) => { if (e.target === $("prevDlg")) $("prevDlg").close(); });
document.addEventListener("keydown", (e) => {
  if (!$("prevDlg").open) return;
  if (e.key === "ArrowLeft") openPreview(prevIdx - 1);
  if (e.key === "ArrowRight") openPreview(prevIdx + 1);
});

let prevRot = 0;
// La finestra prende la forma della pagina (già ruotata): si calcola la scala che la fa stare nello schermo.
function fitPreview() {
  const img = $("prevImg");
  if (!$("prevDlg").open || !img.naturalWidth) return;
  const side = prevRot % 180 !== 0, pad = 28;
  const nw = img.naturalWidth, nh = img.naturalHeight;
  const vw = side ? nh : nw, vh = side ? nw : nh; // dimensioni come si vedono dopo la rotazione
  const s = Math.min((Math.min(innerWidth * 0.94, 1100) - pad) / vw, (innerHeight * 0.8 - pad) / vh);
  const box = $("prevImg").parentElement;
  box.style.width = vw * s + pad + "px";
  box.style.height = vh * s + pad + "px";
  img.style.width = nw * s + "px";
  img.style.height = nh * s + "px";
  img.style.transform = `translate(-50%, -50%) rotate(${prevRot}deg)`;
}
$("prevImg").addEventListener("load", fitPreview);
window.addEventListener("resize", fitPreview);

async function openPreview(i) {
  const p = pages[i];
  if (!p) return;
  prevIdx = i;
  const img = $("prevImg"), msg = $("prevMsg");
  $("prevTitle").textContent = `Pagina ${i + 1} di ${pages.length}`;
  $("prevPrev").disabled = i === 0;
  $("prevNext").disabled = i === pages.length - 1;
  prevRot = p.rot;
  if (!$("prevDlg").open) $("prevDlg").showModal();
  let url = p.page === null ? p.url : prevCache.get(p.id);
  if (!url) {
    img.src = p.url; // mentre arriva quella grande, mostra la miniatura
    msg.textContent = "Carico l'anteprima…";
    try {
      const fd = new FormData();
      fd.append("file", p.file, p.file.name);
      fd.append("page", p.page);
      const res = await fetch("/api/preview", { method: "POST", body: fd });
      if (!res.ok) throw new Error("Anteprima non disponibile.");
      url = URL.createObjectURL(await res.blob());
      prevCache.set(p.id, url);
    } catch (e) {
      if (prevIdx === i) msg.textContent = e.message;
      return;
    }
  }
  if (prevIdx !== i) return; // nel frattempo si è passati a un'altra pagina
  msg.textContent = "";
  img.src = url;
  if (img.complete) fitPreview();
}

const collator = new Intl.Collator("it", { numeric: true, sensitivity: "base" });
$("sortName").onclick = () => { pages.sort((a, b) => collator.compare(a.file.name, b.file.name)); render(); };
$("sortDate").onclick = () => { pages.sort((a, b) => a.file.lastModified - b.file.lastModified); render(); };
function resetAll() { pages.forEach((p) => { URL.revokeObjectURL(p.url); dropPreview(p.id); }); pages = []; selected.clear(); setStatus(""); render(); }
$("clear").onclick = () => { if (confirm("Eliminare tutte le pagine e ricominciare?")) resetAll(); };

$("pick").onclick = () => $("file").click();
$("shoot").onclick = () => $("cam").click();
$("file").onchange = (e) => { addFiles(e.target.files); e.target.value = ""; };
$("cam").onchange = (e) => { addFiles(e.target.files); e.target.value = ""; };

const drop = $("drop");
["dragenter", "dragover"].forEach((ev) => drop.addEventListener(ev, (e) => { if (e.dataTransfer?.types?.includes("Files")) { e.preventDefault(); drop.classList.add("over"); } }));
["dragleave", "drop"].forEach((ev) => drop.addEventListener(ev, () => drop.classList.remove("over")));
drop.addEventListener("drop", (e) => { if (e.dataTransfer?.files?.length) { e.preventDefault(); addFiles(e.dataTransfer.files); } });
// evita che il browser apra il file se lo si lascia fuori dalla zona
window.addEventListener("dragover", (e) => { if (e.dataTransfer?.types?.includes("Files")) e.preventDefault(); });
window.addEventListener("drop", (e) => { if (e.dataTransfer?.files?.length) { e.preventDefault(); addFiles(e.dataTransfer.files); } });

function setStatus(html, err = false) {
  const s = $("status");
  s.innerHTML = html;
  s.className = err ? "err" : "";
}

$("go").onclick = () => {
  if (!pages.length) return;
  $("name").value = "";
  $("nameDlg").showModal();
  $("name").focus();
};
$("nameCancel").onclick = () => $("nameDlg").close();
$("nameForm").onsubmit = (e) => {
  e.preventDefault();
  const name = $("name").value.trim();
  if (!name) return;
  $("nameDlg").close();
  convert(name);
};

async function convert(name) {
  const fd = new FormData();
  const files = [];
  const idx = new Map();
  pages.forEach((p) => { if (!idx.has(p.file)) { idx.set(p.file, files.length); files.push(p.file); } });
  files.forEach((f) => fd.append("files", f, f.name));
  fd.append("items", JSON.stringify(pages.map((p) => ({ file: idx.get(p.file), page: p.page, rot: p.rot }))));
  fd.append("ocr", $("ocr").checked);
  fd.append("lang", $("lang").value);
  fd.append("enhance", $("enhance").checked);
  fd.append("max_mb", $("max").value);
  fd.append("filename", name);

  $("go").disabled = true;
  setStatus('<span class="prog"></span>Sto creando il PDF…' + ($("ocr").checked ? " L'OCR può richiedere qualche minuto." : ""));
  try {
    const res = await fetch("/api/convert", { method: "POST", body: fd });
    if (!res.ok) {
      let msg = "Qualcosa è andato storto.";
      try { msg = (await res.json()).detail || msg; } catch (_) {}
      throw new Error(msg);
    }
    const blob = await res.blob();
    const fname = (name.replace(/[^\w\- ]/g, "").trim() || "documento") + ".pdf";
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = fname; a.click();
    setStatus(`✔ PDF pronto: ${(blob.size / 1024 / 1024).toFixed(1)} MB. <a class="btn" href="${url}" download="${esc(fname)}">Scarica di nuovo</a><button type="button" id="again">Ricomincia da capo</button>`);
    $("again").onclick = resetAll;
  } catch (e) {
    setStatus(esc(e.message), true);
  } finally {
    $("go").disabled = pages.length === 0;
  }
}

render();
</script>
</body>
</html>
